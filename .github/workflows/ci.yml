name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bone_marrow_vision
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d bone_marrow_vision"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - run: "pip install --require-hashes --only-binary=:all: -r requirements/dev.lock"
      - run: pip install --no-deps --no-build-isolation -e ml
      - run: pip check
      - run: python scripts/check_locked_requirements.py
      - run: ruff check backend/app backend/tests backend/alembic
      - run: DATABASE_URL=postgresql+psycopg://app:ci-postgres-password@localhost:5432/bone_marrow_vision alembic upgrade head
        working-directory: backend
      - run: pytest tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://app:ci-postgres-password@localhost:5432/bone_marrow_vision
      - run: POSTGRES_PASSWORD=ci-postgres-password JWT_SECRET=ci-jwt-secret-012345678901234567890123 ADMIN_BOOTSTRAP_TOKEN=ci-admin-token-012345678901234567890123 docker compose config --quiet
  ml:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - run: "pip install --require-hashes --only-binary=:all: -r requirements/dev.lock"
      - run: pip install --no-deps --no-build-isolation -e ml
      - run: pip check
      - run: ruff check src scripts tests
        working-directory: ml
      - run: pytest tests
        working-directory: ml
  frontend:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.23.2'}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - uses: actions/setup-node@v4
        with: {node-version: '22.23.2'}
      - run: "pip install --require-hashes --only-binary=:all: -r requirements/dev.lock"
      - run: pip install --no-deps --no-build-isolation -e ml
      - run: pip check
      - run: npm ci
        working-directory: frontend
      - run: python -m playwright install --with-deps chromium
      - run: ruff check e2e scripts/check_locked_requirements.py
      - run: python -m pytest e2e -q
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: |
            .e2e-artifacts/**/*.log
            .e2e-artifacts/**/failure.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
