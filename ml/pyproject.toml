[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bone-marrow-vision-ml"
version = "0.2.0"
description = "Research-only PyTorch pipeline for bone marrow cell image classification"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.3",
  "torchvision>=0.18",
  "scikit-learn>=1.4",
  "numpy>=1.26",
  "Pillow>=10.2",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "matplotlib>=3.8",
  "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]
extend-exclude = ["src/bone_marrow_vision_ml.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
