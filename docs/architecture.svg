<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">BoneMarrowVision AI system architecture</title>
  <desc id="desc">React frontend connects to a FastAPI backend, PostgreSQL, PyTorch inference, authenticated Grad-CAM outputs, provenance manifests, and the dataset workflow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d2603d"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17211f" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#f4f1ea"/>
  <text x="70" y="72" font-family="Manrope,Arial,sans-serif" font-size="30" font-weight="800" fill="#17211f">BoneMarrowVision AI</text>
  <text x="70" y="104" font-family="DM Mono,monospace" font-size="14" fill="#d2603d">RESEARCH PLATFORM ARCHITECTURE</text>
  <g font-family="Manrope,Arial,sans-serif" filter="url(#shadow)">
    <rect x="70" y="185" width="220" height="120" rx="8" fill="#17211f"/>
    <text x="180" y="232" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">React dashboard</text><text x="180" y="260" text-anchor="middle" font-size="14" fill="#d9e0d9">Upload and analysis UI</text>
    <rect x="400" y="155" width="300" height="180" rx="8" fill="#d2603d"/>
    <text x="550" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">FastAPI REST API</text><text x="550" y="238" text-anchor="middle" font-size="14" fill="#fff">Authentication and uploads</text><text x="550" y="265" text-anchor="middle" font-size="14" fill="#fff">Predictions and analytics</text><text x="550" y="292" text-anchor="middle" font-size="14" fill="#fff">Model registry</text>
    <rect x="810" y="115" width="300" height="120" rx="8" fill="#7b8d80"/>
    <text x="960" y="162" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">PostgreSQL</text><text x="960" y="190" text-anchor="middle" font-size="14" fill="#eef2ed">Users, models, experiments</text><text x="960" y="212" text-anchor="middle" font-size="14" fill="#eef2ed">Predictions and ownership</text>
    <rect x="810" y="285" width="300" height="120" rx="8" fill="#fff" stroke="#7b8d80" stroke-width="3"/>
    <text x="960" y="332" text-anchor="middle" font-size="20" font-weight="700" fill="#17211f">PyTorch inference</text><text x="960" y="360" text-anchor="middle" font-size="14" fill="#58615d">Active model checkpoint</text><text x="960" y="382" text-anchor="middle" font-size="14" fill="#58615d">Confidence and top-3 output</text>
    <rect x="400" y="450" width="300" height="120" rx="8" fill="#fff" stroke="#d2603d" stroke-width="3"/>
    <text x="550" y="497" text-anchor="middle" font-size="20" font-weight="700" fill="#17211f">Grad-CAM reports</text><text x="550" y="525" text-anchor="middle" font-size="14" fill="#58615d">Heatmaps and overlays</text><text x="550" y="547" text-anchor="middle" font-size="14" fill="#58615d">Interpretability aid only</text>
    <rect x="70" y="450" width="220" height="120" rx="8" fill="#fff" stroke="#17211f" stroke-width="3"/>
    <text x="180" y="497" text-anchor="middle" font-size="20" font-weight="700" fill="#17211f">Dataset workflow</text><text x="180" y="525" text-anchor="middle" font-size="14" fill="#58615d">Inspect and split</text><text x="180" y="547" text-anchor="middle" font-size="14" fill="#58615d">Train and evaluate</text>
    <rect x="810" y="475" width="300" height="120" rx="8" fill="#fff" stroke="#17211f" stroke-width="3"/>
    <text x="960" y="522" text-anchor="middle" font-size="20" font-weight="700" fill="#17211f">Provenance manifests</text><text x="960" y="550" text-anchor="middle" font-size="14" fill="#58615d">Hashes, configs, split metadata</text><text x="960" y="572" text-anchor="middle" font-size="14" fill="#58615d">Auditable model artifacts</text>
  </g>
  <g fill="none" stroke="#d2603d" stroke-width="3" marker-end="url(#arrow)">
    <path d="M290 245 H400"/><path d="M700 210 H810"/><path d="M700 285 H810"/><path d="M550 335 V450"/><path d="M400 510 H290"/><path d="M700 510 H810"/>
  </g>
  <text x="70" y="655" font-family="DM Mono,monospace" font-size="13" fill="#58615d">Research and educational use only. No clinical decision support.</text>
</svg>
