<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">BoneMarrowVision AI system architecture</title>
<desc id="desc">React calls FastAPI for authenticated analysis and model administration. PostgreSQL stores users, models and predictions. PyTorch uses the active registered model and generates Grad-CAM outputs. A separate offline workflow audits splits, trains and evaluates models, and produces artifacts. Administrators explicitly register and activate compatible models; training does not activate them automatically.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a4472b"/></marker></defs>
<rect width="1200" height="920" fill="#f4f1ea"/>
<g font-family="Arial,sans-serif" fill="#17211f">
<text x="60" y="64" font-size="30" font-weight="700">BoneMarrowVision AI</text>
<text x="60" y="95" font-family="monospace" font-size="14" fill="#a4472b">SYSTEM ARCHITECTURE</text>
<rect x="30" y="120" width="1140" height="470" rx="12" fill="#fff" stroke="#d9ded7"/>
<text x="60" y="154" font-size="15" font-weight="700">APPLICATION / INFERENCE</text>
<rect x="30" y="620" width="1140" height="230" rx="12" fill="#e8ece5" stroke="#7b8d80" stroke-dasharray="6 5"/>
<text x="60" y="653" font-size="15" font-weight="700">OFFLINE TRAINING / EVALUATION</text>
<rect x="60" y="190" width="320" height="120" rx="8" fill="#17211f" stroke="#7b8d80"/>
<text x="220" y="229" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">React dashboard</text>
<text x="220" y="260" text-anchor="middle" font-size="14" font-weight="400" fill="#fff">Uploads, analysis, prediction history</text>
<text x="220" y="285" text-anchor="middle" font-size="14" font-weight="400" fill="#fff">Model administration for admins</text>
<rect x="440" y="190" width="320" height="120" rx="8" fill="#a4472b" stroke="#7b8d80"/>
<text x="600" y="229" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">FastAPI REST API</text>
<text x="600" y="260" text-anchor="middle" font-size="14" font-weight="400" fill="#fff">Authentication and validated uploads</text>
<text x="600" y="285" text-anchor="middle" font-size="14" font-weight="400" fill="#fff">User-scoped predictions and artifacts</text>
<rect x="820" y="190" width="320" height="120" rx="8" fill="#fff" stroke="#7b8d80"/>
<text x="980" y="229" text-anchor="middle" font-size="20" font-weight="700" fill="#17211f">PyTorch classifier</text>
<text x="980" y="260" text-anchor="middle" font-size="14" font-weight="400" fill="#58615d">Active registered model</text>
<text x="980" y="285" text-anchor="middle" font-size="14" font-weight="400" fill="#58615d">Predicted class and top-3 probabilities</text>
<rect x="60" y="410" width="320" height="120" rx="8" fill="#fff" stroke="#7b8d80"/>
<text x="220" y="449" text-anchor="middle" font-size="20" font-weight="700" fill="#17211f">PostgreSQL</text>
<text x="220" y="480" text-anchor="middle" font-size="14" font-weight="400" fill="#58615d">Users, model versions, activation history</text>
<text x="220" y="505" text-anchor="middle" font-size="14" font-weight="400" fill="#58615d">Predictions, model identity, ownership</text>
<rect x="440" y="410" width="320" height="120" rx="8" fill="#fff" stroke="#7b8d80"/>
<text x="600" y="449" text-anchor="middle" font-size="20" font-weight="700" fill="#17211f">Grad-CAM outputs</text>
<text x="600" y="480" text-anchor="middle" font-size="14" font-weight="400" fill="#58615d">Heatmaps and overlays</text>
<text x="600" y="505" text-anchor="middle" font-size="14" font-weight="400" fill="#58615d">Authenticated delivery through the API</text>
<rect x="820" y="410" width="320" height="120" rx="8" fill="#fff" stroke="#7b8d80"/>
<text x="980" y="449" text-anchor="middle" font-size="20" font-weight="700" fill="#17211f">Model registry</text>
<text x="980" y="480" text-anchor="middle" font-size="14" font-weight="400" fill="#58615d">Validated checkpoints and SHA-256</text>
<text x="980" y="505" text-anchor="middle" font-size="14" font-weight="400" fill="#58615d">Admin registration and explicit activation</text>
<rect x="60" y="680" width="320" height="120" rx="8" fill="#fff" stroke="#7b8d80"/>
<text x="220" y="719" text-anchor="middle" font-size="20" font-weight="700" fill="#17211f">Dataset workflow</text>
<text x="220" y="750" text-anchor="middle" font-size="14" font-weight="400" fill="#58615d">Inspect, audit duplicates, prepare splits</text>
<text x="220" y="775" text-anchor="middle" font-size="14" font-weight="400" fill="#58615d">Verified manifests and exclusion records</text>
<rect x="440" y="680" width="320" height="120" rx="8" fill="#fff" stroke="#7b8d80"/>
<text x="600" y="719" text-anchor="middle" font-size="20" font-weight="700" fill="#17211f">Train and evaluate</text>
<text x="600" y="750" text-anchor="middle" font-size="14" font-weight="400" fill="#58615d">Validation-based checkpoint selection</text>
<text x="600" y="775" text-anchor="middle" font-size="14" font-weight="400" fill="#58615d">Held-out evaluation and comparison</text>
<rect x="820" y="680" width="320" height="120" rx="8" fill="#fff" stroke="#7b8d80"/>
<text x="980" y="719" text-anchor="middle" font-size="20" font-weight="700" fill="#17211f">Model artifacts</text>
<text x="980" y="750" text-anchor="middle" font-size="14" font-weight="400" fill="#58615d">Checkpoints, configurations, metrics</text>
<text x="980" y="775" text-anchor="middle" font-size="14" font-weight="400" fill="#58615d">Input hashes and provenance records</text>
<text x="60" y="830" font-size="13" fill="#58615d">Training produces artifacts; administrators choose which compatible model to register and activate.</text>
</g>
<g fill="none" stroke="#a4472b" stroke-width="2" marker-end="url(#arrow)">
<path d="M380 250 H440"/><path d="M760 230 H820"/>
<path d="M440 275 H405 V470 H380"/><path d="M760 275 H790 V470 H820"/>
<path d="M1010 410 V310"/><path d="M950 310 V350 H600 V410"/>
<path d="M380 740 H440"/><path d="M760 740 H820"/>
<path d="M980 680 V530" stroke-dasharray="6 5"/>
</g>
<g font-family="Arial,sans-serif" font-size="12" fill="#58615d">
<text x="1020" y="375">Load active</text><text x="635" y="340">Generate overlays</text>
<rect x="992" y="593" width="153" height="23" rx="4" fill="#f4f1ea"/>
<text x="1000" y="609">Admin registers via API</text>
<text x="60" y="890" font-family="monospace" font-size="13">Research and educational use only. No clinical decision support.</text>
</g></svg>
